name: Luster — Efe's Digest

on:

  workflow_dispatch:          # Manual trigger

permissions:
  contents: write
  
jobs:
  digest-efe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv anthropic
      - name: Run Efe's digest
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          PERSONAL_EMAIL: ${{ secrets.PERSONAL_EMAIL }}
          PERSONAL_EMAIL_PASSWORD: ${{ secrets.PERSONAL_EMAIL_PASSWORD }}
        run: python search.py --config config_efe.json
      - name: Save seen jobs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_jobs_efe.json
          git diff --staged --quiet || git commit -m "update seen jobs [skip ci]"
          git push
